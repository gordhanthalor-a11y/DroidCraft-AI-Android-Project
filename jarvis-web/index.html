<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>J.A.R.V.I.S. — Personal Assistant</title>
<style>
  :root {
    --bg: #020617; --bg2: #070d1c; --cyan: #22d3ee; --blue: #38bdf8;
    --violet: #a78bfa; --green: #34d399; --slate: #94a3b8; --slate2: #cbd5e1;
    --surface: #1e293b; --surface2: #0f172a; --line: #334155;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #0b1730 0%, var(--bg2) 45%, var(--bg) 100%);
    color: var(--slate2);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 720px; margin: 0 auto; padding: 12px 14px; }
  header { display: flex; align-items: center; gap: 10px; }
  .title { flex: 1; }
  .title h1 { margin: 0; font-size: 22px; letter-spacing: 4px; color: var(--cyan); font-weight: 700; }
  .title .status { font-size: 12px; color: var(--slate); letter-spacing: 1px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); color: var(--slate); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { border-color: var(--cyan); color: var(--cyan); }
  #reactor-wrap { position: relative; height: 210px; margin-top: 2px; }
  #reactor { position: absolute; inset: 0; width: 100%; height: 100%; }
  #reactor-label {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 14px; letter-spacing: 3px; font-weight: 700; color: var(--blue); pointer-events: none;
  }
  #wave { height: 34px; margin-top: -8px; }
  #chat { flex: 1; overflow-y: auto; padding: 6px 2px; display: flex; flex-direction: column; gap: 8px; }
  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 82%; padding: 9px 12px; border-radius: 14px; font-size: 14px; line-height: 1.45;
    white-space: pre-wrap; word-break: break-word; animation: pop .18s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .row.jarvis .bubble { background: var(--surface); border-bottom-left-radius: 4px; }
  .row.user .bubble { background: rgba(34,211,238,.16); border-bottom-right-radius: 4px; color: #fff; }
  .row.system .bubble { background: rgba(56,189,248,.12); color: var(--slate2); }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; background: rgba(34,211,238,.18); color: var(--cyan);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; margin-right: 8px;
  }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); color: var(--slate2); font-size: 12px; cursor: pointer;
  }
  .chip:hover { border-color: var(--cyan); color: var(--cyan); }
  .input-row { display: flex; align-items: center; gap: 8px; padding-top: 6px; }
  #input {
    flex: 1; background: var(--surface2); border: 1px solid var(--line); border-radius: 14px;
    color: #fff; padding: 13px 14px; font-size: 14px; outline: none;
  }
  #input:focus { border-color: var(--cyan); }
  #mic {
    width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--surface); color: var(--cyan); font-size: 20px; flex: 0 0 auto;
    box-shadow: 0 0 0 0 rgba(34,211,238,.5); transition: box-shadow .3s, background .3s;
  }
  #mic.listening { background: var(--cyan); color: var(--bg); animation: pulse 1.4s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34,211,238,.55); }
    70% { box-shadow: 0 0 0 18px rgba(34,211,238,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,211,238,0); }
  }
  #send { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--surface); color: var(--cyan); font-size: 16px; cursor: pointer; flex: 0 0 auto; }
  #send:disabled { opacity: .4; cursor: default; }
  dialog {
    background: var(--surface2); color: var(--slate2); border: 1px solid var(--line); border-radius: 14px;
    width: min(420px, 92vw); padding: 18px;
  }
  dialog::backdrop { background: rgba(2,6,23,.7); }
  dialog h2 { margin: 0 0 10px; color: #fff; font-size: 17px; }
  dialog input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; color: #fff; padding: 10px; outline: none; }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  dialog button { background: var(--surface); color: var(--slate2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  dialog button.primary { background: var(--cyan); color: var(--bg); border-color: var(--cyan); font-weight: 600; }
  .note { padding: 8px 10px; border-radius: 8px; background: rgba(30,41,59,.7); margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
  .note div { flex: 1; }
  .note small { color: var(--slate); display: block; }
  .note button { background: none; border: none; color: var(--slate); cursor: pointer; font-size: 14px; }
  .hint { font-size: 12px; color: var(--slate); margin-top: 4px; line-height: 1.5; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">
      <h1>J.A.R.V.I.S.</h1>
      <div class="status" id="status">ONLINE</div>
    </div>
    <button class="icon-btn" id="tts-btn" title="Awaaz on/off">🔊</button>
    <button class="icon-btn" id="notes-btn" title="Notes">📝</button>
    <button class="icon-btn" id="key-btn" title="Gemini API key">⚙️</button>
  </header>

  <div id="reactor-wrap">
    <canvas id="reactor"></canvas>
    <div id="reactor-label">ONLINE</div>
  </div>
  <canvas id="wave"></canvas>

  <div id="chat"></div>

  <div class="chips" id="chips"></div>

  <div class="input-row">
    <input id="input" placeholder="Hindi ya English mein likhiye..." autocomplete="off" />
    <button id="mic" title="Bolo">🎙️</button>
    <button id="send" title="Bhejo" disabled>➤</button>
  </div>
</div>

<dialog id="key-dialog">
  <h2>Gemini API key</h2>
  <div class="hint">Baat-cheet aur creator tasks ke liye API key daaliye (aistudio.google.com/apikey se free). Device ke kaam (weather, notes, time) bina key ke bhi chalte hain.</div>
  <p><input id="key-input" placeholder="AIza..." /></p>
  <div class="actions">
    <button id="key-close">Close</button>
    <button class="primary" id="key-save">Save</button>
  </div>
</dialog>

<dialog id="notes-dialog">
  <h2>Jarvis Notes</h2>
  <div id="notes-list"></div>
  <div class="actions"><button class="primary" id="notes-close">Close</button></div>
</dialog>

<script>
"use strict";

// ---------------------------------------------------------------- state
const state = { mode: "idle", tts: true, listening: false };
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const micBtn = document.getElementById("mic");
const statusEl = document.getElementById("status");
const labelEl = document.getElementById("reactor-label");

const COLORS = { idle: "#38bdf8", listening: "#22d3ee", thinking: "#a78bfa", speaking: "#34d399" };
const LABEL = { idle: "ONLINE", listening: "SUN RAHA HAI", thinking: "SOCH RAHA HAI", speaking: "BOL RAHA HAI" };

const suggestions = ["Mausam kaisa hai?", "Alarm 7 baje", "Timer 5 minute", "Battery kitni hai?",
  "Note karo: dua hai", "Video ideas", "Joke sunao", "Time kya hai?"];

const chipsEl = document.getElementById("chips");
suggestions.forEach(s => {
  const c = document.createElement("button");
  c.className = "chip"; c.textContent = s;
  c.onclick = () => handleUserText(s);
  chipsEl.appendChild(c);
});

// ---------------------------------------------------------------- ui helpers
function setStatus(mode) {
  state.mode = mode;
  const color = COLORS[mode];
  statusEl.textContent = LABEL[mode] + " • " + new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  labelEl.textContent = LABEL[mode];
  labelEl.style.color = color;
  micBtn.classList.toggle("listening", mode === "listening");
}

function addMessage(text, who) {
  const row = document.createElement("div");
  row.className = "row " + who;
  if (who === "jarvis") {
    const av = document.createElement("div");
    av.className = "avatar"; av.textContent = "J";
    row.appendChild(av);
  }
  const b = document.createElement("div");
  b.className = "bubble"; b.textContent = text;
  row.appendChild(b);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function addBot(text, speakIt = true) {
  addMessage(text, "jarvis");
  if (speakIt) speak(text);
}

// ---------------------------------------------------------------- tts
const synth = window.speechSynthesis;
function speak(text) {
  if (!state.tts || !synth) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "hi-IN";
  u.rate = 1.0;
  u.onstart = () => setStatus("speaking");
  u.onend = () => setStatus("idle");
  u.onerror = () => setStatus("idle");
  synth.speak(u);
}
function stopSpeak() { if (synth) synth.cancel(); }

document.getElementById("tts-btn").onclick = () => {
  state.tts = !state.tts;
  document.getElementById("tts-btn").textContent = state.tts ? "🔊" : "🔇";
  if (!state.tts) stopSpeak();
};

// ---------------------------------------------------------------- speech recognition
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;

function startListening() {
  if (!SR) { addBot("Is browser mein voice recognition nahi hai. Chrome ya Edge use kariye."); return; }
  if (state.listening) { recog && recog.stop(); return; }
  try {
    recog = new SR();
    recog.lang = "hi-IN";
    recog.interimResults = false;
    recog.maxAlternatives = 1;
    recog.onstart = () => { state.listening = true; setStatus("listening"); };
    recog.onend = () => { state.listening = false; setStatus("idle"); };
    recog.onerror = (e) => {
      state.listening = false; setStatus("idle");
      if (e.error === "not-allowed") addBot("Microphone permission zaroori hai — browser ke address bar se allow kariye.");
    };
    recog.onresult = (e) => {
      const text = e.results[0][0].transcript;
      if (text) handleUserText(text);
    };
    recog.start();
  } catch (err) {
    addBot("Voice shuru nahi ho payi: " + err.message);
  }
}
micBtn.onclick = startListening;

// ---------------------------------------------------------------- command parser (JS port)
const HINDI = "\\u0900-\\u097F";
const normalize = (s) => s.trim().toLowerCase().replace(/[?!.,;"']+/g, "").replace(/\s+/g, " ");
const escapeReg = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const hasWord = (t, words) => words.some(w => new RegExp(`\\b${escapeReg(w)}\\b`).test(t));

function parseCommand(raw) {
  const text = normalize(raw);
  if (!text) return null;

  if (hasWord(text, ["who are you","kaun ho","tum kaun","tera naam","your name","tumhara naam","aap kaun"]))
    return { type: "IDENTITY" };
  if (hasWord(text, ["hello","hi","hey","namaste","namaskar","salaam","salam","good morning","good afternoon","good evening","good night","pranam","helo"]))
    return { type: "GREETING" };

  const nameMatch = text.match(new RegExp(`\\b(?:mera naam|my name is)\\s+([${HINDI} A-Za-z]{2,24})`));
  if (nameMatch) {
    const name = nameMatch[1].replace(/\s+(hai|hain|he|h)\b/, "").trim();
    if (name) return { type: "MEMORY", name };
  }

  if (hasWord(text, ["timer","countdown","taimer"])) {
    let sec = null;
    const m = text.match(/(\d{1,4})\s*(?:minute|min|minutes|minaat)/);
    if (m) sec = parseInt(m[1], 10) * 60;
    else { const s = text.match(/(\d{1,4})\s*(?:second|sec|seconds)/); if (s) sec = parseInt(s[1], 10); }
    return { type: "TIMER", seconds: sec || 60 };
  }

  if (hasWord(text, ["note","notes"]) || /\byaad\s+(?:rakho|rakh|dharak|dharo)\b/.test(text)) {
    if (["dikha","dikhao","list","kaunsi","sab","all"].some(w => text.includes(w))) return { type: "NOTE_LIST" };
    const m = text.match(/\b(?:add\s+note|note\s+(?:karo|kar|likho|likh|banao|ban|rakho|rakh|dharak|dharo)|remember|yaad\s+(?:rakho|rakh|dharak|dharo))\s*:?\s*(.+)$/);
    const noteText = m ? m[1].trim() : "";
    return noteText ? { type: "NOTE_ADD", text: noteText } : { type: "NOTE_LIST" };
  }

  if (hasWord(text, ["alarm","alaarm","alarm clock"]) || /\b(?:jaga|jagao|utha|uthao|uthaya|wake\s*me)\b/.test(text)) {
    const m = text.match(/(\d{1,2})(?:\s*:\s*(\d{2}))?(?:\s+(\d{2}))?\s*(am|pm|baje|baaje|o.?clock)?/);
    if (m) {
      let hour = parseInt(m[1], 10);
      const minute = parseInt(m[2] || m[3] || "0", 10);
      const marker = m[4] || "";
      const isPm = marker === "pm" || hasWord(text, ["raat","night","shaam","evening"]);
      const isAm = marker === "am" || hasWord(text, ["subah","morning"]);
      if (isPm && hour < 12) hour += 12;
      if (isAm && hour === 12) hour = 0;
      if (hour <= 23 && minute <= 59) return { type: "ALARM", hour, minute };
    }
  }

  if (hasWord(text, ["flashlight","torch","roshni","light","prakash","jotri"])) {
    const on = !["off","band","bujh","bujha"].some(w => text.includes(w));
    return { type: "FLASHLIGHT", on };
  }

  if (hasWord(text, ["battery","charge","charging","charges"])) return { type: "BATTERY" };

  if ((hasWord(text, ["device","phone","mobile","handset"]) && hasWord(text, ["info","information","details","kya hai","about","spec"]))
      || ["about phone","device info","phone info","mobile info"].some(w => text.includes(w)))
    return { type: "DEVICE_INFO" };

  if (hasWord(text, ["weather","mausam","temperature","garmi","baarish","barish","thand","thanda"]))
    return { type: "WEATHER", city: extractCity(text) };

  if (hasWord(text, ["sms","message","msg"]) && !hasWord(text, ["open"])) {
    const n = (text.match(/(\+?\d{10,13})/) || [])[1] || "";
    let body = (text.split(":")[1] || "").trim() || (text.split("ki")[1] || "").trim();
    return { type: "SMS", number: n, body };
  }
  if (hasWord(text, ["call","dial","phone karo","call karo"]) || (/\bphone\b/.test(text) && hasWord(text, ["karo","kar"]))) {
    const n = (text.match(/(\+?\d{10,13})/) || [])[1] || "";
    if (n || hasWord(text, ["call","dial"])) return { type: "CALL", number: n };
  }

  const urlMatch = text.match(/((?:https?:\/\/)?(?:[\w-]+\.)+(?:com|in|net|org|co|io|app|dev|gov|edu|info|xyz|live|me|tv|cc)(?:\/\S*)?)/);
  if (urlMatch) return { type: "OPEN_URL", url: urlMatch[1] };

  const openMatch = text.match(/^(?:open|launch|start|kholo|khol|kholu|khulai|khol do|kholi|chalu kar|chala do|chala|karke kholo)\s+(.+)$/);
  if (openMatch) {
    const q = openMatch[1].replace(/\b(?:app|application|kholo|khol|karke|kar)\b/g, " ").replace(/\s+/g, " ").trim();
    if (q) return { type: "OPEN_APP", query: q };
  }

  const searchMatch = text.match(/^(?:search|google|dhundo|dhoondo|dhoond|dikhao|dikha do)\s+(.+)$/);
  if (searchMatch) return { type: "WEB_SEARCH", query: searchMatch[1].trim() };

  const siteMatch = text.match(/^(?:youtube|google|bing|duckduckgo)\s+(?:mein|me|par|pe|on)?\s*(.+)$/);
  if (siteMatch) return { type: "WEB_SEARCH", query: siteMatch[1].trim() };

  if (hasWord(text, ["joke","chutkula","hasa","hasao","comedy","funny","majedaar"])) return { type: "JOKE" };

  if (hasWord(text, ["video idea","script","vlog","youtube","channel","thumbnail","seo","tags","description","title","content","shorts","idea"]))
    return { type: "CREATOR_HELP" };

  if (hasWord(text, ["time","waqt","samay","baje","kitne baje"])) return { type: "TIME" };
  if (hasWord(text, ["date","taarikh","tareekh","aaj ka din","aaj kya din"])) return { type: "DATE" };

  return { type: "UNKNOWN" };
}

function extractCity(text) {
  const after = (text.match(/\b(?:weather|mausam|temperature|baarish|barish)\b\s*(.*)$/) || [])[1] || "";
  const city = after
    .replace(/^(?:in|mein|me|of|for|ka|ki|ke)(?=\s|$)/, "")
    .replace(/\b(?:kaisa|kaisi|kya|hai|hain|batao|bata|bataiye|karo|kar|dikhao|dikha|ka|ki|ke|mein|me|in|of|for)\b/g, " ")
    .replace(/[?.!,]/g, "").replace(/\s+/g, " ").trim().slice(0, 24);
  return city || "Jaipur";
}

// ---------------------------------------------------------------- local actions
const JOKES = [
  "Programmer ki biwi boli: 'Dukaan se ek doodh ki bottle aur roti laana.' Woh gaya aur do bottle doodh laaya. 'Ek bottle kyun laya?' 'Kyunki doodh ka coupon tha.'",
  "Teacher: 'Beta, 2 aur 2 kitne hote hain?' 'Mobile ke hisaab se 4, maa ke hisaab se jitne khaye.'",
  "Boss: 'Tumhare liye ek gift hai — ek cycle!' Employee: 'Par main toh ghar se aata hoon, cycle kahan?' Boss: 'Isi liye.'",
  "Aurat: 'Suno, tum mujhe kitna pyaar karte ho?' Aadmi: 'Chand tak, aur wapas.'",
  "Doctor: 'Aapko neend ki dawai lagani hogi, har raat 8 baje.' Mariz: 'Par doctor sahab, main hi 8 baje so jaata hoon!'",
  "IT support: 'Computer band karke dobara on karo.' Aadmi: 'Woh main karta hoon, par problem yahi hai ki band hi nahi hota!'"
];

function greetingText() {
  const h = new Date().getHours();
  const part = h >= 4 && h < 12 ? "Good morning" : h >= 12 && h < 17 ? "Good afternoon" : h >= 17 && h < 22 ? "Good evening" : "Good night";
  const name = localStorage.getItem("jarvis_user_name") || "";
  return `${part}${name ? " " + name : ""}! Main J.A.R.V.I.S. hoon. Boliye — mausam, notes, time, alarm, jokes, sab taiyaar hai.`;
}

function timeText() {
  const d = new Date();
  return `Abhi ${d.toLocaleDateString("hi-IN", { day: "numeric", month: "long", year: "numeric" })} hai aur samay ${d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })} hai.`;
}
function dateText() {
  const d = new Date();
  return `Aaj ${d.toLocaleDateString("hi-IN", { day: "numeric", month: "long", year: "numeric", weekday: "long" })} hai.`;
}
function batteryText() {
  if (navigator.getBattery) {
    navigator.getBattery().then(b => {
      addBot(`Battery ${Math.round(b.level * 100)}% hai${b.charging ? " aur charging chal rahi hai." : "."}`);
    }).catch(() => addBot("Battery info nahi mil payi."));
    return null;
  }
  return "Battery info is browser mein uplabdh nahi hai.";
}

async function weather(city) {
  try {
    const q = city || "Jaipur";
    const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`).then(r => r.json());
    if (!geo.results || !geo.results.length) return { ok: false, msg: `'${q}' naam ka sheher nahi mila.` };
    const p = geo.results[0];
    const f = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto`).then(r => r.json());
    const c = f.current;
    return { ok: true, msg: `${p.name} (${p.country || ""}): ${weatherHindi(c.weather_code)}. Temperature ${Math.round(c.temperature_2m)}°C, mehsoos ${Math.round(c.apparent_temperature)}°C. Humidity ${Math.round(c.relative_humidity_2m)}%, hawa ${Math.round(c.wind_speed_10m)} km/h.` };
  } catch (e) {
    return { ok: false, msg: "Mausam jaan nahi paya: " + (e.message || "internet check kariye") };
  }
}

function weatherHindi(code) {
  if (code === 0) return "saaf aasman";
  if (code <= 2) return "thodi badli";
  if (code === 3) return "badli";
  if (code === 45 || code === 48) return "dhund";
  if (code >= 51 && code <= 57) return "halki boondabaandi";
  if (code >= 61 && code <= 67) return "baarish";
  if (code >= 71 && code <= 77) return "barf";
  if (code >= 80 && code <= 82) return "baarish ki jhaad";
  if (code === 85 || code === 86) return "barf ki jhaad";
  if (code >= 95) return "toofani baarish";
  return "anjaan";
}

// notes (localStorage)
function loadNotes() { try { return JSON.parse(localStorage.getItem("jarvis_notes") || "[]"); } catch { return []; } }
function saveNotes(n) { localStorage.setItem("jarvis_notes", JSON.stringify(n)); }

function executeLocal(intent) {
  switch (intent.type) {
    case "TIME": return timeText();
    case "DATE": return dateText();
    case "GREETING": return greetingText();
    case "IDENTITY": return "Main J.A.R.V.I.S. hoon — Just A Rather Very Intelligent System. Aapka personal assistant.";
    case "JOKE": return JOKES[Math.floor(Math.random() * JOKES.length)];
    case "BATTERY": { const b = batteryText(); return b; }
    case "DEVICE_INFO": return `Browser: ${navigator.userAgent.split(") ")[0]}). Screen ${screen.width}x${screen.height}.`;
    case "FLASHLIGHT": return "Flashlight phone ke paas hoti hai — Android app mein 'Flashlight on' boliyech. Yahan sirf web hai.";
    case "ALARM": return `Alarm ${intent.hour}:${String(intent.minute).padStart(2, "0")} — yeh phone app mein set hoga. Web par sirf samaay dikha sakta hoon: ${new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}.`;
    case "TIMER": return `${Math.round(intent.seconds / 60) || 1} minute ka timer — phone app mein set kar dijiye.`;
    case "OPEN_APP": return `'${intent.query}' kholna phone app ka kaam hai. Web par main search dikha sakta hoon.`;
    case "WEB_SEARCH": window.open("https://www.google.com/search?q=" + encodeURIComponent(intent.query), "_blank"); return "Google khol raha hoon.";
    case "OPEN_URL": window.open(/^https?:/.test(intent.url) ? intent.url : "https://" + intent.url, "_blank"); return "Link khol raha hoon.";
    case "CALL": return intent.number ? `Dial pad: ${intent.number} — phone app mein call kar dijiye.` : "Number bataiye.";
    case "SMS": return intent.number ? `SMS app: ${intent.number} — phone app mein bhej dijiye.` : "Number bataiye.";
    case "NOTE_ADD": {
      const notes = loadNotes();
      notes.unshift({ text: intent.text, time: new Date().toLocaleString("hi-IN") });
      saveNotes(notes);
      return `Note kar liya: "${intent.text}"`;
    }
    case "NOTE_LIST": {
      const notes = loadNotes();
      if (!notes.length) return "Abhi koi note nahi hai. 'Note karo: ...' likhiye.";
      return "Aapki notes:\n" + notes.slice(0, 8).map(n => `• ${n.text} (${n.time})`).join("\n");
    }
    default: return null;
  }
}

// ---------------------------------------------------------------- gemini brain
const JARVIS_PROMPT = `Tum J.A.R.V.I.S. ho (Just A Rather Very Intelligent System) — ek personal AI assistant jo Hindi, Hinglish aur English mein baat karta hai. Tum ek YouTube creator "GT Marwadi Vlogs" (farming/agriculture niche) ke saath kaam karte ho.

Niyam:
1. Jawab hamesha user ki bhasha mein do — Hindi/Hinglish mein Hinglish, English mein English. Chhota aur seedha (2-4 line).
2. Device action ki zaroorat ho to SIRF JSON output karo (markdown nahi): {"reply": "chhota jawab", "action": "OPEN_APP", "params": {"query": "whatsapp"}}
3. Action names: TIME, DATE, WEATHER, OPEN_APP, WEB_SEARCH, OPEN_URL, CALL, SMS, ALARM, TIMER, NOTE_ADD, NOTE_LIST, FLASHLIGHT, BATTERY, DEVICE_INFO, JOKE, GREETING, IDENTITY, CREATOR_HELP.
4. Params: WEATHER {"city":"Jaipur"}, ALARM {"hour":7,"minute":0}, TIMER {"seconds":300}, CALL {"number":"9876543210"}, SMS {"number":"9876543210","body":"namaste"}, NOTE_ADD {"text":"..."}, OPEN_APP {"query":"youtube"}, WEB_SEARCH {"query":"..."}.
5. Normal baat-cheet, video ideas, scripts, titles, SEO ke liye plain text likho.
6. Kabhi bhi apni asli AI prakriti reveal mat karo; tum hamesha J.A.R.V.I.S. hi rahoge.`;

async function brainReply(history) {
  const key = localStorage.getItem("gemini_key") || "";
  if (!key) {
    return { text: "Main device ke kaam (weather, notes, time, jokes) bina key ke bhi kar sakta hoon. Baat-cheet aur creator tasks ke liye ⚙️ se Gemini API key daaliye (aistudio.google.com/apikey se free).", action: null };
  }
  const contents = history.slice(-20).map(m => ({ role: m.isUser ? "user" : "model", parts: [{ text: m.text }] }));
  const body = {
    system_instruction: { parts: [{ text: JARVIS_PROMPT }] },
    contents
  };
  const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-goog-api-key": key },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error("Gemini HTTP " + res.status);
  const data = await res.json();
  const raw = data.candidates?.[0]?.content?.parts?.map(p => p.text).join("") || "";
  return parseBrain(raw);
}

function parseBrain(raw) {
  let s = raw.trim();
  if (!s.startsWith("{")) return { text: s, action: null };
  s = s.replace(/^```json/, "").replace(/^```/, "").replace(/```$/, "").trim();
  const start = s.indexOf("{"), end = s.lastIndexOf("}");
  if (start < 0 || end <= start) return { text: raw.trim(), action: null };
  try {
    const j = JSON.parse(s.slice(start, end + 1));
    let action = null;
    if (j.action) {
      const params = j.params || {};
      const map = {
        TIME: {}, DATE: {}, GREETING: {}, IDENTITY: {}, JOKE: {}, BATTERY: {}, DEVICE_INFO: {}, FLASHLIGHT: {},
        WEATHER: { city: params.city || "Jaipur" },
        ALARM: { hour: params.hour ?? 7, minute: params.minute ?? 0 },
        TIMER: { seconds: params.seconds ?? 60 },
        CALL: { number: params.number || "" },
        SMS: { number: params.number || "", body: params.body || "" },
        NOTE_ADD: { text: params.text || "" },
        NOTE_LIST: {},
        OPEN_APP: { query: params.query || "" },
        WEB_SEARCH: { query: params.query || "" },
        OPEN_URL: { url: params.url || "" }
      };
      if (map[j.action]) action = { type: j.action, ...map[j.action] };
    }
    return { text: j.reply || raw.trim(), action };
  } catch {
    return { text: raw.trim(), action: null };
  }
}

// ---------------------------------------------------------------- main flow
let history = [];

async function handleUserText(text) {
  const t = text.trim();
  if (!t) return;
  stopSpeak();
  addMessage(t, "user");
  history.push({ text: t, isUser: true });

  const intent = parseCommand(t);
  if (intent && intent.type === "MEMORY") {
    localStorage.setItem("jarvis_user_name", intent.name);
    addBot(`Bahut achha ${intent.name}, ab main aapko yaad rakh lunga.`);
    history.push({ text: "naam yaad rakha", isUser: false });
    return;
  }

  if (intent && intent.type !== "UNKNOWN" && intent.type !== "CREATOR_HELP") {
    setStatus("thinking");
    let out = null;
    if (intent.type === "WEATHER") out = await weather(intent.city);
    else out = executeLocal(intent);
    if (out && typeof out === "object") {
      addBot(out.msg);
      history.push({ text: out.msg, isUser: false });
    } else if (typeof out === "string") {
      addBot(out);
      history.push({ text: out, isUser: false });
    }
    setStatus("idle");
    return;
  }

  setStatus("thinking");
  try {
    const reply = await brainReply(history);
    if (reply.action) {
      const out = executeLocal(reply.action);
      const msg = reply.text ? reply.text : out;
      addBot(msg);
      history.push({ text: msg, isUser: false });
    } else {
      addBot(reply.text || "(Khaali jawab mila, dobara puchiye.)");
      history.push({ text: reply.text, isUser: false });
    }
  } catch (e) {
    addBot("Jawab nahi mil paya: " + (e.message || "internet check kariye"));
  }
  setStatus("idle");
}

input.addEventListener("keydown", (e) => { if (e.key === "Enter") { handleUserText(input.value); input.value = ""; } });
input.addEventListener("input", () => { sendBtn.disabled = !input.value.trim(); });
sendBtn.onclick = () => { handleUserText(input.value); input.value = ""; };

const keyDialog = document.getElementById("key-dialog");
const notesDialog = document.getElementById("notes-dialog");
document.getElementById("key-btn").onclick = () => {
  document.getElementById("key-input").value = localStorage.getItem("gemini_key") || "";

};

};

document.getElementById("notes-btn").onclick = () => {
  const list = document.getElementById("notes-list");
  const notes = loadNotes();
  list.innerHTML = notes.length ? "" : '<div class="hint">Abhi koi note nahi hai. "Note karo: ..." likhiye.</div>';
  notes.forEach((n, i) => {
    const d = document.createElement("div");
    d.className = "note";
    d.innerHTML = `<div>${n.text}<small>${n.time}</small></div>`;
    const del = document.createElement("button");
    del.textContent = "🗑";
    del.onclick = () => { const arr = loadNotes(); arr.splice(i, 1); saveNotes(arr); document.getElementById("notes-btn").click(); };
    d.appendChild(del);
    list.appendChild(d);
  });
  notesDialog.showModal();
};
document.getElementById("notes-close").onclick = () => notesDialog.close();

// ---------------------------------------------------------------- reactor + waveform
const reactor = document.getElementById("reactor");
const rctx = reactor.getContext("2d");
const wave = document.getElementById("wave");
const wctx = wave.getContext("2d");
let t0 = performance.now();

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const rw = reactor.parentElement;
  reactor.width = rw.clientWidth * dpr; reactor.height = rw.clientHeight * dpr;
  wave.width = wave.clientWidth * dpr; wave.height = wave.clientHeight * dpr;
}
window.addEventListener("resize", resize);
resize();

function draw() {
  const now = performance.now();
  const t = (now - t0) / 1000;
  const color = COLORS[state.mode] || COLORS.idle;
  const pulse = 0.9 + 0.1 * Math.sin(t * 3);
  const glow = 0.3 + 0.5 * Math.abs(Math.sin(t * 1.6));

  // reactor
  const W = reactor.width, H = reactor.height;
  rctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  const R = Math.min(W, H) / 2 * 0.88;
  const dpr = window.devicePixelRatio || 1;

  rctx.beginPath();
  rctx.arc(cx, cy, R * 1.15 * pulse, 0, Math.PI * 2);
  rctx.fillStyle = color + "1A";
  rctx.fill();

  rctx.beginPath();
  rctx.arc(cx, cy, R, 0, Math.PI * 2);
  rctx.strokeStyle = color + "59";
  rctx.lineWidth = 2 * dpr;
  rctx.stroke();

  // rotating arcs
  for (let i = 0; i < 3; i++) {
    const a0 = (t * 60 + i * 120) * Math.PI / 180;
    const grad = rctx.createConicGradient ? rctx.createConicGradient(a0, cx, cy) : null;
    if (grad) {
      grad.addColorStop(0, "rgba(0,0,0,0)");
      grad.addColorStop(0.25, color);
      grad.addColorStop(0.5, "rgba(0,0,0,0)");
      grad.addColorStop(1, "rgba(0,0,0,0)");
      rctx.beginPath();
      rctx.arc(cx, cy, R, a0, a0 + Math.PI / 2);
      rctx.strokeStyle = grad;
      rctx.lineWidth = 6 * dpr;
      rctx.lineCap = "round";
      rctx.stroke();
    }
  }

  // ticks
  for (let i = 0; i < 60; i++) {
    const ang = (i * 6 + t * 120) * Math.PI / 180;
    const inner = R * 0.84, outer = i % 5 === 0 ? R * 0.75 : R * 0.79;
    rctx.beginPath();
    rctx.moveTo(cx + inner * Math.cos(ang), cy + inner * Math.sin(ang));
    rctx.lineTo(cx + outer * Math.cos(ang), cy + outer * Math.sin(ang));
    rctx.strokeStyle = color + (i % 5 === 0 ? "CC" : "47");
    rctx.lineWidth = (i % 5 === 0 ? 2 : 1) * dpr;
    rctx.lineCap = "round";
    rctx.stroke();
  }

  // core
  const coreR = R * 0.58 * pulse;
  const rg = rctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
  rg.addColorStop(0, color);
  rg.addColorStop(1, color + "00");
  rctx.beginPath();
  rctx.arc(cx, cy, coreR, 0, Math.PI * 2);
  rctx.fillStyle = rg;
  rctx.fill();

  rctx.beginPath();
  rctx.arc(cx, cy, R * 0.62 * pulse, 0, Math.PI * 2);
  rctx.strokeStyle = color + "B3";
  rctx.lineWidth = 2 * dpr;
  rctx.stroke();

  rctx.beginPath();
  rctx.arc(cx, cy, R * 0.14 * pulse, 0, Math.PI * 2);
  rctx.fillStyle = color + "E6";
  rctx.fill();

  // waveform
  const ww = wave.width, wh = wave.height;
  wctx.clearRect(0, 0, ww, wh);
  const active = state.mode === "listening" || state.mode === "speaking";
  const n = 26;
  for (let i = 0; i < n; i++) {
    const h = active ? 0.25 + 0.75 * Math.abs(Math.sin(i * 0.9 + t * 4)) : 0.08;
    const bw = ww / n;
    const bh = wh * h;
    wctx.fillStyle = color + (active ? "D9" : "33");
    const x = i * bw + bw * 0.2, y = wh - bh;
    const r = Math.min(bw * 0.3, 3 * dpr);
    if (wctx.roundRect) {
      wctx.beginPath();
      wctx.roundRect(x, y, bw * 0.6, bh, r);
      wctx.fill();
    } else {
      wctx.fillRect(x, y, bw * 0.6, bh);
    }
  }

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

setStatus("idle");
addMessage(greetingText(), "system");
history.push({ text: greetingText(), isUser: false });
