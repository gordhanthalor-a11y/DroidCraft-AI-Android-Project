<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050b15" />
  <title>J.A.R.V.I.S. · DroidCraft</title>
  <script>
    (function () {
      window.__JARVIS_HUD_READY = false;
      function reportHudError(message, source, line, error) {
        var detail = "[JarvisHUD] " + message;
        if (source) detail += " at " + source + (line ? ":" + line : "");
        if (error && error.stack) detail += "\n" + error.stack;
        console.error(detail);
        try {
          if (window.JarvisBridge && typeof window.JarvisBridge.onHudError === "function") {
            window.JarvisBridge.onHudError(detail);
          }
        } catch (bridgeError) {
          console.error("[JarvisHUD] Could not forward error to Android", bridgeError);
        }
      }
      window.__reportJarvisHudError = reportHudError;
      window.addEventListener("error", function (event) {
        reportHudError(event.message || "Unhandled JavaScript error", event.filename, event.lineno, event.error);
      });
      window.addEventListener("unhandledrejection", function (event) {
        var reason = event.reason && event.reason.message ? event.reason.message : String(event.reason || "Unknown rejection");
        reportHudError("Unhandled promise rejection: " + reason, "", 0, event.reason);
      });
    })();
  </script>
  <style>
    :root {
      color-scheme: dark;
      --void: #050b15;
      --deep: #081421;
      --glass: rgba(8, 20, 33, .78);
      --cyan: #56eff7;
      --teal: #48e1c2;
      --amber: #e6b55a;
      --red: #ff4964;
      --white: #eafaff;
      --muted: #92aab8;
      --hairline: rgba(107, 229, 239, .16);
      --mono: "Roboto Mono", "SF Mono", "Droid Sans Mono", monospace;
      --ui: system-ui, "Roboto", sans-serif;
      font-family: var(--ui);
      background: var(--void);
      color: var(--white);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      position: relative;
      isolation: isolate;
      background:
        radial-gradient(ellipse 82% 60% at 50% 42%, rgba(9, 65, 82, .29), transparent 76%),
        radial-gradient(ellipse 115% 85% at 50% 50%, #0a1522 0, var(--void) 76%);
      color: var(--white);
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }

    button { color: inherit; font: inherit; }
    .ambient-grid, .trace-art, .scanline { position: fixed; inset: 0; pointer-events: none; }
    .ambient-grid {
      z-index: -3;
      background-image: linear-gradient(rgba(89, 226, 240, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(89, 226, 240, .035) 1px, transparent 1px);
      background-size: 29px 29px;
      mask-image: radial-gradient(ellipse 83% 70% at 50% 50%, #000 16%, transparent 100%);
    }
    .trace-art { z-index: -2; opacity: .55; }
    .trace-art path, .trace-art circle { fill: none; stroke: rgba(76, 219, 231, .18); stroke-width: .7; vector-effect: non-scaling-stroke; }
    .trace-art circle { fill: rgba(86, 239, 247, .42); stroke: none; }
    .scanline {
      z-index: -1;
      opacity: .12;
      background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(125, 230, 239, .055) 4px, transparent 5px);
      mix-blend-mode: screen;
    }

    #hud {
      width: 100%; height: 100%;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 15px calc(10px + env(safe-area-inset-bottom, 0px));
      display: flex; flex-direction: column; gap: clamp(7px, 1.5vh, 13px);
      position: relative; z-index: 1;
    }
    .topline { display: flex; align-items: center; justify-content: space-between; min-height: 48px; gap: 10px; }
    .brand { min-width: 0; display: flex; align-items: center; gap: 10px; }
    .brand-core {
      width: 30px; height: 30px; flex: 0 0 auto; position: relative; border-radius: 50%;
      background: radial-gradient(circle, #eaffff 0 8%, #71f5fa 18%, rgba(14, 150, 166, .86) 42%, rgba(6, 37, 54, .2) 68%, transparent 72%);
      filter: drop-shadow(0 0 8px rgba(86, 239, 247, .75));
    }
    .brand-core::before, .brand-core::after { content: ""; position: absolute; border: 1px solid rgba(86, 239, 247, .6); border-radius: 50%; inset: 3px; }
    .brand-core::after { inset: -3px; border-style: dashed; opacity: .6; animation: spin 18s linear infinite; }
    .brand-stack { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .wordmark { font: 800 13px/1 var(--mono); letter-spacing: .22em; white-space: nowrap; color: #f1fdff; text-shadow: 0 0 14px rgba(86,239,247,.28); }
    .tagline { font: 600 8px/1.1 var(--mono); letter-spacing: .17em; color: var(--muted); }
    .header-right { display: flex; align-items: center; gap: 7px; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px;
      border: 1px solid rgba(86, 239, 247, .24); border-radius: 99px;
      background: rgba(14, 52, 63, .34); color: var(--cyan);
      font: 700 8px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 9px var(--teal); }
    #hud[data-state="thinking"] .status-dot { background: var(--amber); box-shadow: 0 0 9px var(--amber); }
    #hud[data-state="listening"] .status-dot { background: var(--red); box-shadow: 0 0 9px var(--red); animation: blink 1s ease-in-out infinite; }
    .icon-action {
      width: 34px; height: 34px; display: grid; place-items: center; padding: 0;
      background: rgba(14, 35, 50, .62); border: 1px solid var(--hairline); border-radius: 12px;
      color: var(--cyan); cursor: pointer; transition: transform .16s ease, background .18s ease, border-color .18s ease;
    }
    .icon-action svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .icon-action:active, .quick-action:active, .control-button:active { transform: scale(.94); background-color: rgba(45, 125, 141, .42); }

    .readout-row { display: grid; grid-template-columns: 1fr 1.35fr; gap: 8px; }
    .readout {
      min-height: 50px; display: flex; align-items: center; gap: 9px; min-width: 0;
      padding: 8px 11px; border-radius: 14px; border: 1px solid rgba(88, 198, 211, .14);
      background: linear-gradient(135deg, rgba(11, 31, 45, .74), rgba(7, 18, 29, .56));
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .readout-icon { width: 25px; height: 25px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 9px; color: var(--cyan); background: rgba(61, 208, 222, .09); }
    .readout-icon svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .readout-copy { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .readout-label { color: #6f95a4; font: 600 7px/1 var(--mono); letter-spacing: .15em; text-transform: uppercase; }
    .readout-value { overflow: hidden; color: #d9f9fc; font: 600 10px/1.15 var(--mono); text-overflow: ellipsis; white-space: nowrap; }
    #weather-readout { text-align: left; cursor: pointer; }
    #weather-readout .readout-value { color: var(--cyan); }
    #weather-readout.is-loading .readout-value { color: var(--amber); }

    .orb-stage { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
    .core-kicker { color: #7795a2; font: 600 8px/1 var(--mono); letter-spacing: .25em; text-transform: uppercase; margin-bottom: 3px; }
    .reactor-housing {
      width: min(72vw, 336px, 47vh); height: min(72vw, 336px, 47vh);
      flex: 0 0 auto; position: relative; display: grid; place-items: center;
      border: 0; padding: 0; background: transparent; border-radius: 50%; cursor: pointer; isolation: isolate;
      -webkit-appearance: none;
    }
    .reactor-housing::before {
      content: ""; position: absolute; inset: 16%; border-radius: 50%; z-index: -1;
      background: radial-gradient(circle, rgba(20, 196, 211, .20), rgba(13, 93, 115, .08) 49%, transparent 73%);
      filter: blur(13px); transform: scale(calc(1 + var(--audio-level, 0) * .16)); opacity: .9;
      transition: transform .12s ease-out;
    }
    .reactor-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .ring-base { fill: none; stroke: rgba(86, 239, 247, .13); stroke-width: .55; }
    .ring-dots { fill: none; stroke: rgba(86, 239, 247, .38); stroke-width: .8; stroke-dasharray: 1 3.4; }
    .ring-segments { fill: none; stroke: rgba(99, 225, 235, .58); stroke-width: 1.2; stroke-dasharray: 11 4 2 4; }
    .ring-thin { fill: none; stroke: rgba(111, 235, 243, .30); stroke-width: .55; stroke-dasharray: 22 3 2 4; }
    .ring-accent { fill: none; stroke: rgba(230, 181, 90, .73); stroke-width: 1.1; stroke-dasharray: 32 190; stroke-linecap: round; transform: rotate(-78deg); transform-origin: 100px 100px; }
    .ring-spin-a { animation: spin 52s linear infinite; transform-origin: 100px 100px; }
    .ring-spin-b { animation: spin-reverse 37s linear infinite; transform-origin: 100px 100px; }
    .ring-spin-c { animation: spin 23s linear infinite; transform-origin: 100px 100px; }
    .ring-tick { stroke: rgba(86,239,247,.84); stroke-width: .9; stroke-linecap: round; }
    .ring-tick.major { stroke: var(--cyan); stroke-width: 1.5; }
    #particle-canvas { position: absolute; inset: 11%; width: 78%; height: 78%; overflow: visible; pointer-events: none; }
    .arc-core { position: relative; z-index: -1; width: 28%; aspect-ratio: 1; border-radius: 50%; opacity: .25; filter: blur(12px); background: #52eef7; transition: opacity .25s, filter .25s; }
    .arc-nucleus { display: none; }
    #hud[data-state="listening"] .arc-core { opacity: .44; filter: blur(17px); }
    #hud[data-state="thinking"] .arc-core { background: var(--amber); opacity: .42; }
    #hud[data-state="speaking"] .arc-core { opacity: .6; filter: blur(21px); }
    .state-caption { margin-top: 1px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    #status-text { color: var(--cyan); font: 700 9px/1 var(--mono); letter-spacing: .22em; text-transform: uppercase; }
    #orb-caption { max-width: 280px; color: var(--muted); font: 500 9px/1.25 var(--mono); letter-spacing: .07em; text-align: center; }
    #hud[data-state="thinking"] #status-text, #hud[data-state="thinking"] #orb-caption { color: var(--amber); }
    #hud[data-state="listening"] #status-text { color: var(--red); }

    .quick-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .quick-action {
      min-width: 0; min-height: 54px; display: flex; align-items: center; gap: 9px; padding: 8px 10px;
      border: 1px solid rgba(86, 239, 247, .16); border-radius: 14px;
      background: linear-gradient(145deg, rgba(12, 36, 51, .68), rgba(6, 18, 29, .65));
      cursor: pointer; text-align: left; transition: transform .16s ease, border-color .18s ease, background .18s ease;
    }
    .quick-glyph { width: 29px; height: 29px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 10px; color: var(--cyan); background: rgba(73, 220, 232, .1); }
    .quick-glyph svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .quick-copy { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .quick-title { overflow: hidden; color: #ddf8fa; font: 700 9px/1 var(--mono); letter-spacing: .05em; text-overflow: ellipsis; white-space: nowrap; }
    .quick-sub { overflow: hidden; color: #7797a4; font: 500 7px/1 var(--mono); text-overflow: ellipsis; white-space: nowrap; }
    .control-bar {
      min-height: 62px; display: flex; align-items: center; justify-content: space-around; gap: 8px;
      padding: 7px 10px; border: 1px solid rgba(83, 182, 197, .16); border-radius: 19px;
      background: rgba(5, 16, 26, .77); box-shadow: 0 -8px 38px rgba(0, 0, 0, .20);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    }
    .control-button { min-width: 53px; height: 46px; padding: 0 9px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px; border: 0; border-radius: 12px; color: #85a7b2; background: transparent; cursor: pointer; transition: transform .16s, color .18s, background .18s; }
    .control-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .control-label { color: inherit; font: 600 7px/1 var(--mono); letter-spacing: .06em; }
    #btn-mic { width: 51px; height: 51px; min-width: 51px; border: 1px solid rgba(255, 94, 117, .7); border-radius: 50%; color: #fff; background: radial-gradient(circle at 38% 34%, #ff8798, #ff4964 45%, #a4142a 100%); box-shadow: 0 0 18px rgba(255, 73, 100, .36), inset 0 1px 8px rgba(255,255,255,.35); }
    #btn-mic svg { width: 19px; height: 19px; }
    #btn-mic .control-label { color: #fff1f3; }
    #hud[data-state="listening"] #btn-mic { animation: mic-pulse .95s ease-in-out infinite; }
    #btn-power.btn-active, #btn-history:hover, #btn-settings-bottom:hover { color: var(--cyan); background: rgba(86,239,247,.08); }
    .feedback { min-height: 13px; text-align: center; color: var(--teal); font: 600 8px/1.2 var(--mono); letter-spacing: .08em; opacity: 0; transform: translateY(3px); transition: opacity .2s, transform .2s; }
    .feedback.visible { opacity: 1; transform: translateY(0); }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spin-reverse { to { transform: rotate(-360deg); } }
    @keyframes blink { 50% { opacity: .36; } }
    @keyframes mic-pulse { 50% { transform: scale(1.07); box-shadow: 0 0 26px rgba(255,73,100,.78), inset 0 1px 8px rgba(255,255,255,.4); } }
    #hud.is-paused *, #hud.is-paused *::before, #hud.is-paused *::after { animation-play-state: paused !important; }
    @media (max-height: 690px) {
      #hud { gap: 6px; padding-top: calc(6px + env(safe-area-inset-top, 0px)); }
      .readout { min-height: 43px; padding-block: 6px; }
      .reactor-housing { width: min(62vw, 285px, 40vh); height: min(62vw, 285px, 40vh); }
      .quick-action { min-height: 48px; padding: 6px 8px; }
      .control-bar { min-height: 56px; padding: 4px 8px; }
    }
    @media (max-width: 360px) {
      #hud { padding-inline: 11px; }
      .wordmark { letter-spacing: .16em; font-size: 12px; }
      .status-pill { padding-inline: 8px; font-size: 7px; }
      .quick-action { gap: 6px; padding-inline: 7px; }
      .quick-glyph { width: 26px; height: 26px; }
      .quick-title { font-size: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="ambient-grid" aria-hidden="true"></div>
  <svg class="trace-art" viewBox="0 0 400 800" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 112h42v28h24v65h22m312-118h-46v43h-19v48h-22M0 536h44v-42h28v-37h27m301 104h-40v-39h-31v-42h-24M58 0v63h34v33h26m224-96v71h-34v39h-24M94 800v-68h31v-35h33m194 103v-54h-28v-40h-29" />
    <path d="M0 260h35v28h42m323-64h-38v31h-46M0 646h28v-30h55m317-36h-48v30h-35" />
    <circle cx="88" cy="205" r="2"/><circle cx="322" cy="158" r="2"/><circle cx="105" cy="507" r="2"/><circle cx="316" cy="564" r="2"/><circle cx="117" cy="96" r="2"/><circle cx="305" cy="699" r="2"/>
  </svg>
  <div class="scanline" aria-hidden="true"></div>

  <main id="hud" data-state="idle">
    <header class="topline">
      <div class="brand" id="core-mark-btn" role="button" tabindex="0" aria-label="Open Jarvis history">
        <span class="brand-core" aria-hidden="true"></span>
        <span class="brand-stack">
          <span class="wordmark">J . A . R . V . I . S</span>
          <span class="tagline">DROIDCRAFT INTELLIGENCE · <span id="live-clock">--:--</span></span>
        </span>
      </div>
      <div class="header-right">
        <div class="status-pill"><span class="status-dot"></span><span id="status-text">ONLINE</span></div>
        <button class="icon-action" id="hdr-settings-btn" title="Settings" aria-label="Open settings">
          <svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 0 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 0 1 0-3.4h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 0 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V2a1.7 1.7 0 0 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 0 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2 2.9Z"/></svg>
        </button>
      </div>
    </header>

    <section class="readout-row" aria-label="System telemetry">
      <div class="readout">
        <span class="readout-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg></span>
        <span class="readout-copy"><span class="readout-label">Local time</span><span class="readout-value" id="time-readout">--:--</span></span>
      </div>
      <button class="readout" id="weather-readout" aria-label="Enable location-based weather">
        <span class="readout-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.5 17.5a4 4 0 0 1 0-8 5.8 5.8 0 0 1 11.2 1.6 3.2 3.2 0 0 1-.2 6.4Z"/><path d="m9 14 2-2 1.5 1.5L15 11"/></svg></span>
        <span class="readout-copy"><span class="readout-label" id="weather-place">Local weather</span><span class="readout-value" id="weather-value">Tap to enable</span></span>
      </button>
    </section>

    <section class="orb-stage" aria-label="Jarvis core">
      <div class="core-kicker">Neural interface · Mk 85</div>
      <button class="reactor-housing" id="reactor-assembly" aria-label="Open Jarvis voice controls">
        <svg class="reactor-svg" viewBox="0 0 200 200" aria-hidden="true">
          <g class="ring-spin-a">
            <circle class="ring-base" cx="100" cy="100" r="95"/>
            <circle class="ring-dots" cx="100" cy="100" r="91"/>
            <circle class="ring-segments" cx="100" cy="100" r="84"/>
            <path class="ring-accent" d="M100 16a84 84 0 0 1 83 72"/>
            <g id="ring-ticks-outer"></g>
          </g>
          <g class="ring-spin-b">
            <circle class="ring-base" cx="100" cy="100" r="75"/>
            <circle class="ring-thin" cx="100" cy="100" r="70"/>
            <g id="ring-ticks-inner"></g>
          </g>
          <g class="ring-spin-c">
            <circle class="ring-dots" cx="100" cy="100" r="57"/>
            <path class="ring-accent" d="M100 43a57 57 0 0 1 54 38" style="stroke:rgba(86,239,247,.85);stroke-dasharray:24 160"/>
          </g>
        </svg>
        <canvas id="particle-canvas" aria-hidden="true"></canvas>
        <span class="arc-core" id="arc-core" aria-hidden="true"></span>
        <span class="arc-nucleus" id="arc-nucleus" aria-hidden="true"></span>
      </button>
      <div class="state-caption" aria-live="polite">
        <span id="orb-caption">SYSTEM ONLINE · TAP TO SPEAK</span>
      </div>
    </section>

    <nav class="quick-actions" aria-label="Jarvis quick actions">
      <button class="quick-action" id="btn-vision" aria-label="Open Screen tools">
        <span class="quick-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="12" rx="2"/><path d="M8 20h8m-4-4v4"/><path d="m9 9 2 2 4-4"/></svg></span>
        <span class="quick-copy"><span class="quick-title" id="label-vision">Screen</span><span class="quick-sub">Visual tools</span></span>
      </button>
      <button class="quick-action" id="btn-memories" aria-label="Open memories">
        <span class="quick-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.7A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/><path d="M8.5 12h2l1.2-2.3 1.5 4.6 1.1-2.3h1.2"/></svg></span>
        <span class="quick-copy"><span class="quick-title">Memories</span><span class="quick-sub">Your saved facts</span></span>
      </button>
      <button class="quick-action" id="btn-language" aria-label="Choose language">
        <span class="quick-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h10M9 3v2m3 0c-.7 4-3.3 7-7 9m1-6c1 2 3 4 5 5M14 20l3.2-8 3.3 8m-5.5-2h4.5"/></svg></span>
        <span class="quick-copy"><span class="quick-title">Language</span><span class="quick-sub">Voice preference</span></span>
      </button>
    </nav>

    <footer>
      <div class="control-bar" aria-label="Voice and assistant controls">
        <button class="control-button" id="btn-power" aria-label="Start or stop Live Talk">
          <svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.4 5.7a8 8 0 1 0 11.2 0"/></svg>
          <span class="control-label" id="label-power">Live</span>
        </button>
        <button class="control-button" id="btn-history" aria-label="Open chat history">
          <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v9a2.5 2.5 0 0 1-2.5 2.5H10l-5 4v-4.3A2.5 2.5 0 0 1 4 14.5Z"/><path d="M8 8h8M8 12h5"/></svg>
          <span class="control-label">History</span>
        </button>
        <button class="control-button" id="btn-mic" aria-label="Start voice input">
          <svg viewBox="0 0 24 24"><path d="M12 14a3.2 3.2 0 0 0 3.2-3.2V6.2a3.2 3.2 0 0 0-6.4 0v4.6A3.2 3.2 0 0 0 12 14Z"/><path d="M5.5 10.8a6.5 6.5 0 0 0 13 0M12 17.3v3.2m-3 0h6"/></svg>
          <span class="control-label">Talk</span>
        </button>
        <button class="control-button" id="btn-settings-bottom" aria-label="Open settings">
          <svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 0 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 0 1 0-3.4h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 0 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V2a1.7 1.7 0 0 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 0 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2 2.9Z"/></svg>
          <span class="control-label">Config</span>
        </button>
      </div>
      <div class="feedback" id="action-feedback" aria-live="polite"></div>
    </footer>
  </main>

  <script>
    (function () {
      'use strict';
      try {
        var hud = document.getElementById('hud');
        var statusText = document.getElementById('status-text');
        var orbCaption = document.getElementById('orb-caption');
        var arcCore = document.getElementById('arc-core');
        var canvas = document.getElementById('particle-canvas');
        var ctx = canvas.getContext('2d', { alpha: true });
        var weatherReadout = document.getElementById('weather-readout');
        var weatherPlace = document.getElementById('weather-place');
        var weatherValue = document.getElementById('weather-value');
        var feedback = document.getElementById('action-feedback');
        var currentState = 'idle';
        var audioLevel = 0;
        var visible = true;
        var frame = 0;
        var raf = 0;
        var lastFrame = 0;
        var width = 0;
        var height = 0;
        var dpr = 1;
        var feedbackTimer = 0;
        var clockTimer = 0;

        function makeTicks(groupId, count, inner, outer, majorEvery) {
          var group = document.getElementById(groupId);
          if (!group) return;
          var markup = '';
          for (var i = 0; i < count; i++) {
            var angle = (i * 360 / count) - 90;
            var major = i % majorEvery === 0;
            markup += '<line class="ring-tick' + (major ? ' major' : '') + '" x1="100" y1="' + inner + '" x2="100" y2="' + (major ? outer - 2 : outer) + '" transform="rotate(' + angle + ' 100 100)"/>';
          }
          group.innerHTML = markup;
        }
        makeTicks('ring-ticks-outer', 72, 88, 95, 6);
        makeTicks('ring-ticks-inner', 48, 72, 76, 4);

        var particles = [];
        var particleCount = 2400;
        var goldenAngle = Math.PI * (3 - Math.sqrt(5));
        for (var p = 0; p < particleCount; p++) {
          var y = 1 - (p / (particleCount - 1)) * 2;
          var radius = Math.sqrt(Math.max(0, 1 - y * y));
          var theta = goldenAngle * p;
          particles.push({
            x: Math.cos(theta) * radius,
            y: y,
            z: Math.sin(theta) * radius,
            size: .36 + Math.random() * 1.22,
            seed: Math.random() * Math.PI * 2,
            bright: .35 + Math.random() * .65
          });
        }

        function resizeCanvas() {
          var rect = canvas.getBoundingClientRect();
          dpr = Math.min(window.devicePixelRatio || 1, 1.5);
          width = Math.max(1, rect.width);
          height = Math.max(1, rect.height);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        if (window.ResizeObserver) new ResizeObserver(resizeCanvas).observe(canvas);
        window.addEventListener('resize', resizeCanvas, { passive: true });
        resizeCanvas();

        function drawSphere(timestamp) {
          if (!visible || document.hidden) { raf = 0; return; }
          if (timestamp - lastFrame < 28) { raf = requestAnimationFrame(drawSphere); return; }
          lastFrame = timestamp;
          frame += .008 + audioLevel * .012;
          ctx.clearRect(0, 0, width, height);
          var cx = width / 2;
          var cy = height / 2;
          var base = Math.min(width, height) * (.36 + (currentState === 'listening' ? audioLevel * .025 : 0));
          var ry = frame * (currentState === 'thinking' ? 1.9 : .7);
          var rx = Math.sin(frame * .27) * .18 + (currentState === 'speaking' ? .1 : 0);
          var cosY = Math.cos(ry), sinY = Math.sin(ry), cosX = Math.cos(rx), sinX = Math.sin(rx);
          var isThinking = currentState === 'thinking';
          var isListening = currentState === 'listening';
          var isSpeaking = currentState === 'speaking';
          for (var i = 0; i < particles.length; i++) {
            var dot = particles[i];
            var x1 = dot.x * cosY - dot.z * sinY;
            var z1 = dot.x * sinY + dot.z * cosY;
            var y1 = dot.y * cosX - z1 * sinX;
            var z2 = dot.y * sinX + z1 * cosX;
            var wave = Math.sin(frame * 2.4 + dot.seed) * (isSpeaking ? .06 : isListening ? audioLevel * .06 : isThinking ? .045 : .018);
            var perspective = 1.06 / (1.12 - z2 * .14);
            var px = cx + x1 * (base + wave * base) * perspective;
            var py = cy + y1 * (base + wave * base) * perspective;
            var depth = (z2 + 1) / 2;
            var twinkle = .68 + .32 * Math.sin(timestamp * .0014 + dot.seed);
            var alpha = (.12 + depth * .72) * dot.bright * twinkle;
            var size = dot.size * (.62 + depth * .64) * (isSpeaking ? 1.12 : 1);
            var hue = isThinking ? 39 : isSpeaking ? 187 : isListening ? 184 : 187;
            var saturation = isThinking ? 90 : 91;
            var light = 53 + depth * 38;
            ctx.fillStyle = 'hsla(' + hue + ',' + saturation + '%,' + light + '%,' + alpha + ')';
            ctx.beginPath();
            ctx.arc(px, py, size, 0, Math.PI * 2);
            ctx.fill();
            if (size > 1.35 && depth > .66) {
              ctx.fillStyle = 'rgba(210,255,255,' + (alpha * .25) + ')';
              ctx.fillRect(px - size * 1.8, py - .25, size * 3.6, .5);
            }
          }
          var haze = ctx.createRadialGradient(cx, cy, base * .08, cx, cy, base * 1.05);
          haze.addColorStop(0, isThinking ? 'rgba(238,180,84,.11)' : 'rgba(94,238,246,.12)');
          haze.addColorStop(.7, 'rgba(26,151,171,.035)');
          haze.addColorStop(1, 'rgba(10,60,82,0)');
          ctx.globalCompositeOperation = 'destination-over';
          ctx.fillStyle = haze;
          ctx.beginPath(); ctx.arc(cx, cy, base * 1.05, 0, Math.PI * 2); ctx.fill();
          ctx.globalCompositeOperation = 'source-over';
          raf = requestAnimationFrame(drawSphere);
        }

        function startAnimation() {
          if (visible && !document.hidden && !raf) raf = requestAnimationFrame(drawSphere);
        }
        function stopAnimation() {
          if (raf) cancelAnimationFrame(raf);
          raf = 0;
        }
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) { stopAnimation(); window.clearInterval(clockTimer); clockTimer = 0; }
          else { startAnimation(); if (!clockTimer) clockTimer = window.setInterval(updateClock, 15000); }
        });
        startAnimation();

        function setState(state, level) {
          if (!state) return;
          currentState = String(state).toLowerCase();
          hud.dataset.state = currentState;
          if (typeof level === 'number') audioLevel = Math.max(0, Math.min(1, level));
          var labels = {
            idle: ['ONLINE', 'SYSTEM ONLINE · TAP TO SPEAK'],
            listening: ['LISTENING', 'VOICE INPUT ACTIVE · SPEAK NATURALLY'],
            thinking: ['ANALYZING', 'PARSING REQUEST · STAND BY'],
            speaking: ['RESPONDING', 'JARVIS IS TRANSMITTING AUDIO']
          };
          var value = labels[currentState] || labels.idle;
          statusText.textContent = value[0];
          if (!window.__nativeConnectionCaption) orbCaption.textContent = value[1];
          if (arcCore) arcCore.style.transform = 'scale(' + (1 + audioLevel * .24) + ')';
          if (currentState === 'idle') audioLevel = 0;
        }
        window.setOrbState = setState;
        window.updateState = setState;
        window.setAudioLevel = function (level) {
          if (typeof level === 'number') audioLevel = Math.max(0, Math.min(1, level));
        };
        window.setAudioFrequency = function (amp, pitchHz, bass, mid, high) {
          if (currentState === 'speaking') audioLevel = Math.max(0, Math.min(1, (Number(bass) || 0) * .65 + (Number(mid) || 0) * .35));
        };
        window.setConnectionStatus = function (status, detail) {
          if (!status) return;
          statusText.textContent = String(status).toUpperCase();
          window.__nativeConnectionCaption = detail || '';
          if (detail) orbCaption.textContent = String(detail);
        };
        window.updateConnectionStatus = window.setConnectionStatus;
        window.setLiveTime = function () { updateClock(); };
        window.updateLiveTime = window.setLiveTime;
        window.setPowerState = function (isOn) {
          var button = document.getElementById('btn-power');
          button.classList.toggle('btn-active', !!isOn);
          document.getElementById('label-power').textContent = isOn ? 'End Live' : 'Live';
        };
        window.updatePowerState = window.setPowerState;
        window.setMicMuted = function (isMuted) {
          var button = document.getElementById('btn-mic');
          button.style.filter = isMuted ? 'grayscale(.8) brightness(.65)' : '';
          button.setAttribute('aria-label', isMuted ? 'Microphone muted' : 'Start voice input');
        };
        window.updateMicMuted = window.setMicMuted;
        window.setScreenShareState = function (isSharing) {
          document.getElementById('btn-vision').classList.toggle('btn-active', !!isSharing);
        };
        window.updateScreenShareState = window.setScreenShareState;
        window.setHudWeather = function (place, value, loading) {
          weatherPlace.textContent = place || 'Local weather';
          weatherValue.textContent = value || 'Tap to enable';
          weatherReadout.classList.toggle('is-loading', !!loading);
          weatherReadout.setAttribute('aria-label', (place || 'Local weather') + ': ' + (value || 'Tap to enable'));
        };
        window.setHudVisible = function (isVisible) {
          visible = !!isVisible;
          hud.classList.toggle('is-paused', !visible);
          if (visible) {
            startAnimation();
            if (!clockTimer && !document.hidden) clockTimer = window.setInterval(updateClock, 15000);
          } else {
            stopAnimation();
            window.clearInterval(clockTimer);
            clockTimer = 0;
          }
        };
        window.setVisibility = window.setHudVisible;

        window.updateLiveUserTranscript = function () {};
        window.updateLiveAssistantResponse = function () {};
        window.finalizeLiveTurn = function () {};
        window.syncChatTurns = function () {};

        function dispatch(name) {
          try {
            var bridge = window.JarvisBridge;
            if (bridge && typeof bridge[name] === 'function') bridge[name]();
            else showFeedback('This control is not available yet.');
          } catch (error) {
            if (window.__reportJarvisHudError) window.__reportJarvisHudError('Bridge action failed: ' + name, '', 0, error);
          }
        }
        function showFeedback(message) {
          feedback.textContent = message;
          feedback.classList.add('visible');
          window.clearTimeout(feedbackTimer);
          feedbackTimer = window.setTimeout(function () { feedback.classList.remove('visible'); }, 2400);
        }
        window.setHudFeedback = showFeedback;

        function updateClock() {
          var now = new Date();
          var h = now.getHours();
          var m = String(now.getMinutes()).padStart(2, '0');
          var ampm = h >= 12 ? 'PM' : 'AM';
          h = h % 12 || 12;
          var text = h + ':' + m + ' ' + ampm;
          document.getElementById('live-clock').textContent = text;
          document.getElementById('time-readout').textContent = text;
        }
        updateClock();
        clockTimer = window.setInterval(updateClock, 15000);

        document.getElementById('reactor-assembly').addEventListener('click', function () { dispatch('onOrbClicked'); });
        document.getElementById('btn-mic').addEventListener('click', function () { dispatch('onMicClicked'); });
        document.getElementById('btn-power').addEventListener('click', function () { dispatch('onPowerClicked'); });
        document.getElementById('btn-vision').addEventListener('click', function () { dispatch('onScreenShareClicked'); });
        document.getElementById('btn-history').addEventListener('click', function () { dispatch('onHistoryClicked'); });
        document.getElementById('btn-settings-bottom').addEventListener('click', function () { dispatch('onSettingsClicked'); });
        document.getElementById('hdr-settings-btn').addEventListener('click', function () { dispatch('onSettingsClicked'); });
        document.getElementById('btn-memories').addEventListener('click', function () { dispatch('onMemoriesClicked'); });
        document.getElementById('btn-language').addEventListener('click', function () { dispatch('onLanguageClicked'); });
        document.getElementById('weather-readout').addEventListener('click', function () { dispatch('onWeatherClicked'); });
        document.getElementById('core-mark-btn').addEventListener('click', function () { dispatch('onHistoryClicked'); });
        document.getElementById('core-mark-btn').addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); dispatch('onHistoryClicked'); }
        });

        setState('idle', 0);
        window.__JARVIS_HUD_READY = true;
        document.documentElement.dataset.hudReady = 'true';
      } catch (error) {
        window.__JARVIS_HUD_READY = false;
        document.documentElement.dataset.hudReady = 'error';
        var detail = error && error.stack ? error.stack : String(error);
        if (window.__reportJarvisHudError) window.__reportJarvisHudError('HUD initialization failed: ' + detail, '', 0, error);
        else console.error('[JarvisHUD] HUD initialization failed', error);
      }
    })();
  </script>
</body>
</html>
