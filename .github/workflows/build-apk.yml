name: Build DroidCraft Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      apk_sha256: ${{ steps.verify_apk.outputs.sha256 }}
    env:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: droidcraft-ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools for signature verification
        run: sdkmanager "build-tools;35.0.0"

      - name: Prepare fixed signing keystore
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_SIGNING_KEYSTORE_BASE64 \
            ANDROID_SIGNING_STORE_PASSWORD \
            ANDROID_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing repository Actions secret: ${secret_name}"
              exit 1
            fi
          done

          keystore_file="$RUNNER_TEMP/droidcraft-fixed-signing.p12"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"
          chmod 600 "$keystore_file"
          if ! keytool -list -keystore "$keystore_file" -storetype PKCS12 \
              -storepass "$ANDROID_SIGNING_STORE_PASSWORD" \
              -alias "$ANDROID_SIGNING_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The fixed signing keystore or its configured password/alias is invalid."
            exit 1
          fi
          echo "ANDROID_SIGNING_KEYSTORE_FILE=$keystore_file" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Verify APK signature and record SHA-256
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "::error::Android SDK path is not set."
            exit 1
          fi
          apksigner="$sdk_root/build-tools/35.0.0/apksigner"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          sha256="$(sha256sum "$apk" | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload untouched Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidCraft-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish APK as release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DroidCraft APK build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk

  verify-artifact:
    name: Verify uploaded APK bytes and signature
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: DroidCraft-app-debug
          path: verified-apk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools for signature verification
        run: sdkmanager "build-tools;35.0.0"

      - name: Verify downloaded artifact is byte-identical and valid
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          apk="verified-apk/app-debug.apk"
          test -s "$apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "::error::Android SDK path is not set."
            exit 1
          fi
          apksigner="$sdk_root/build-tools/35.0.0/apksigner"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          actual_sha256="$(sha256sum "$apk" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::Downloaded artifact SHA-256 differs from the Gradle output."
            echo "Gradle output: $EXPECTED_SHA256"
            echo "Artifact:      $actual_sha256"
            exit 1
          fi
          echo "Uploaded artifact is byte-identical to the signed Gradle output."
