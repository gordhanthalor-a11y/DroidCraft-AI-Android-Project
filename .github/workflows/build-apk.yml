name: Build DroidCraft Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      apk_sha256: ${{ steps.verify_apk.outputs.sha256 }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate committed PKCS#12 debug keystore
        env:
          DEBUG_KEYSTORE_PASSWORD: DroidCraftDebugKey2026
        run: >-
          keytool -list -keystore keystore/droidcraft-debug.keystore
          -storetype PKCS12 -storepass "$DEBUG_KEYSTORE_PASSWORD" -alias droidcraft
          >/dev/null

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build.log

      - name: Annotate Gradle compiler errors
        if: failure()
        shell: bash
        run: |
          if [[ -f build.log ]]; then
            details="$(awk '/^\* What went wrong:/{capture=1} capture{print} /^BUILD FAILED/{if (capture) exit}' build.log)"
            if [[ -z "$details" ]]; then
              details="$(tail -n 60 build.log)"
            fi
            while IFS= read -r message; do
              [[ -z "$message" ]] || echo "::error::$message"
            done <<< "$details"
          fi

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DroidCraft-build-log
          path: build.log
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Verify APK signature and record SHA-256
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk_root/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner" || ! -x "$apksigner" ]]; then
            echo "::error::Could not find Android SDK apksigner under $sdk_root/build-tools."
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$apk"
          sha256="$(sha256sum "$apk" | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload untouched Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidCraft-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish APK as release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DroidCraft APK build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk

  verify-artifact:
    name: Verify uploaded APK bytes and signature
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: DroidCraft-app-debug
          path: verified-apk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify downloaded artifact is byte-identical and valid
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          apk="verified-apk/app-debug.apk"
          test -s "$apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk_root/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner" || ! -x "$apksigner" ]]; then
            echo "::error::Could not find Android SDK apksigner under $sdk_root/build-tools."
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$apk"
          actual_sha256="$(sha256sum "$apk" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::Downloaded artifact SHA-256 differs from the Gradle output."
            echo "Gradle output: $EXPECTED_SHA256"
            echo "Artifact:      $actual_sha256"
            exit 1
          fi
          echo "Uploaded artifact is byte-identical to the signed Gradle output."
