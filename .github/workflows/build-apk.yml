name: Build DroidCraft Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle 8.10.2
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      shell: bash

    - name: Report build errors as issue
      if: failure()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        { echo '```'; grep -E "^e: |error:|What went wrong|> " build.log | head -120; echo; tail -60 build.log; echo '```'; } > body.md
        gh issue create --title "Build ${{ github.run_number }} failed" --body-file body.md

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: DroidCraft-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14

    - name: Publish APK as release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: DroidCraft APK build ${{ github.run_number }}
        files: app/build/outputs/apk/debug/app-debug.apk
